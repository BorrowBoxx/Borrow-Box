<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorrowBox - Campus Lending</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-hover: #262626;
      --border: #2e2e2e;
      --primary: #2979ff;
      --primary-hover: #1c54b2;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --free-badge: #00e676;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 20px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .user-auth-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-auth {
      background: #252525;
      border: 1px solid var(--border);
      color: white;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-auth:hover { border-color: var(--primary); }

    .btn-chats-nav {
      background: #1e1e1e;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-chats-nav:hover {
      background: var(--primary);
      color: white;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .sticky-panel {
      position: sticky;
      top: 24px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }

    label:first-of-type { margin-top: 0; }

    input, select, button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #252525;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus { outline: 2px solid var(--primary); }

    .btn-primary {
      margin-top: 16px;
      background: var(--primary);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .item-card:last-child { border-bottom: none; }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .item-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 130px;
    }

    .pill-group { display: flex; gap: 6px; }

    .price-pill {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .price-free { background: rgba(0, 230, 118, 0.15); color: var(--free-badge); }
    .price-paid { background: rgba(41, 121, 255, 0.15); color: var(--primary); }
    .status-borrowed { background: rgba(117, 117, 117, 0.3); color: #ccc; }

    .btn-sm {
      background: #2a2a2a;
      border: 1px solid #444;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      width: auto;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-sm:hover { background: var(--primary); border-color: var(--primary); }
    .btn-danger { color: var(--danger); border-color: rgba(255,82,82,0.4); }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Modals */
    .chat-modal, .inbox-modal {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 380px;
      height: 500px;
      background: #181818;
      border: 1px solid #383838;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
    }

    .modal-header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 1.2rem; cursor: pointer; width: auto; padding: 0 4px;
    }

    .inbox-list {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .inbox-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .inbox-card:hover { border-color: var(--primary); background: var(--surface-hover); }

    .inbox-item-title { font-weight: 600; font-size: 0.95rem; color: var(--primary); margin-bottom: 4px; }
    .inbox-item-sub { font-size: 0.8rem; color: var(--text-muted); }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.mine { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.theirs { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; }
    .mine .msg-bubble { background: var(--primary); color: white; }
    .theirs .msg-bubble { background: #2b2b2b; color: var(--text); }
    .msg-author { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; }

    .chat-form {
      padding: 10px; background: var(--surface);
      border-top: 1px solid var(--border); display: flex; gap: 8px;
    }
    .chat-form input { margin: 0; padding: 9px 12px; font-size: 0.88rem; }
    .chat-form button { margin: 0; width: auto; padding: 9px 16px; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 36px 0; font-size: 0.95rem; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, 
      doc, updateDoc, deleteDoc, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDaRZSOTsZKW2XXWXN7ShSB0FWnz3fOMDo",
      authDomain: "borrowbox-80a89.firebaseapp.com",
      projectId: "borrowbox-80a89",
      storageBucket: "borrowbox-80a89.firebasestorage.app",
      messagingSenderId: "666197824095",
      appId: "1:666197824095:web:097462096aaf8291d941ea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let activeConversationId = null;
    let unsubscribeMessages = null;

    // 1. Auth Listener
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const authArea = document.getElementById("authArea");
      const submitBtn = document.getElementById("submitBtn");

      if (user) {
        authArea.innerHTML = `
          <button class="btn-chats-nav" onclick="openInbox()">💬 My Chats</button>
          <span style="font-size:0.85rem;">👋 ${user.displayName.split(" ")[0]}</span>
          <button class="btn-auth" onclick="logout()">Sign Out</button>
        `;
        submitBtn.disabled = false;
        submitBtn.innerText = "List Gear";
      } else {
        authArea.innerHTML = `
          <button class="btn-auth" onclick="login()">Google Sign In</button>
        `;
        submitBtn.disabled = true;
        submitBtn.innerText = "Sign In to List Gear";
      }
    });

    window.login = async () => {
      try { await signInWithPopup(auth, provider); }
      catch (err) { alert("Login failed: " + err.message); }
    };

    window.logout = () => signOut(auth);

    // 2. Real-Time Feed
    const feedContainer = document.getElementById("itemFeed");
    const qItems = query(collection(db, "items"), orderBy("createdAt", "desc"));

    onSnapshot(qItems, (snapshot) => {
      feedContainer.innerHTML = "";
      if (snapshot.empty) {
        feedContainer.innerHTML = `<div class="empty-state">No gear listed yet.<br>List an item on the left!</div>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const isOwner = currentUser && item.ownerUid === currentUser.uid;
        const isBorrowed = item.status === "borrowed";

        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <div>
            <div class="item-title">${item.title || "Untitled"}</div>
            <div class="item-sub">
              📍 ${item.location || "Campus"} • By: <strong>${isOwner ? "You" : (item.ownerName || "Student")}</strong><br>
              <small style="color:#777;">Category: ${item.category}</small>
            </div>
          </div>
          <div class="item-actions">
            <div class="pill-group">
              <span class="price-pill ${item.isFree ? 'price-free' : 'price-paid'}">
                ${item.isFree ? "FREE" : "₹" + item.price}
              </span>
              ${isBorrowed ? '<span class="price-pill status-borrowed">BORROWED</span>' : ''}
            </div>

            ${isOwner ? `
              <div style="display:flex; gap:4px; margin-top:4px;">
                <button class="btn-sm" onclick="openOwnerItemChats('${id}', '${item.title.replace(/'/g, "\\'")}')">
                  💬 Inquiries
                </button>
                <button class="btn-sm" onclick="toggleBorrowed('${id}', ${isBorrowed})">
                  ${isBorrowed ? "Available" : "Borrowed"}
                </button>
                <button class="btn-sm btn-danger" onclick="deleteItem('${id}')">✕</button>
              </div>
            ` : `
              <button class="btn-sm" ${isBorrowed ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''} 
                onclick="startChatWithLender('${id}', '${item.title.replace(/'/g, "\\'")}', '${item.ownerUid}', '${item.ownerName}')">
                ${isBorrowed ? "Unavailable" : "Chat / Borrow"}
              </button>
            `}
          </div>
        `;
        feedContainer.appendChild(div);
      });
    });

    // 3. List Item
    window.listItem = async function() {
      if (!currentUser) return alert("Sign in first!");
      const title = document.getElementById("itemTitle").value.trim();
      const location = document.getElementById("itemLocation").value.trim();
      const category = document.getElementById("itemCategory").value;
      const price = document.getElementById("itemPrice").value.trim();

      if (!title) return alert("Enter item name.");

      const isFree = !price || price === "0";
      await addDoc(collection(db, "items"), {
        ownerUid: currentUser.uid,
        ownerName: currentUser.displayName,
        title,
        location: location || "Campus",
        category,
        isFree,
        price: isFree ? 0 : Number(price),
        status: "available",
        createdAt: serverTimestamp()
      });

      document.getElementById("itemTitle").value = "";
      document.getElementById("itemLocation").value = "";
      document.getElementById("itemPrice").value = "";
    };

    window.toggleBorrowed = async (id, currentStatus) => {
      await updateDoc(doc(db, "items", id), {
        status: currentStatus ? "available" : "borrowed"
      });
    };

    window.deleteItem = async (id) => {
      if (confirm("Delete this listing permanently?")) {
        await deleteDoc(doc(db, "items", id));
      }
    };

    // 4. Start / Find Chat Thread
    window.startChatWithLender = async function(itemId, itemTitle, lenderUid, lenderName) {
      if (!currentUser) return alert("Please sign in with Google to chat.");
      if (currentUser.uid === lenderUid) return alert("This is your own listing!");

      // Composite ID so borrower and lender share exactly 1 chat for this item
      const convoId = `${itemId}_${currentUser.uid}`;

      await updateDoc(doc(db, "conversations", convoId), {
        itemId,
        itemTitle,
        borrowerUid: currentUser.uid,
        borrowerName: currentUser.displayName,
        lenderUid,
        lenderName,
        participants: [currentUser.uid, lenderUid],
        lastUpdated: serverTimestamp()
      }).catch(async () => {
        // If document doesn't exist, create it via addDoc with deterministic ID
        const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
        await setDoc(doc(db, "conversations", convoId), {
          itemId,
          itemTitle,
          borrowerUid: currentUser.uid,
          borrowerName: currentUser.displayName,
          lenderUid,
          lenderName,
          participants: [currentUser.uid, lenderUid],
          lastUpdated: serverTimestamp()
        });
      });

      openChatWindow(convoId, `${itemTitle} (Lender: ${lenderName})`);
    };

    // 5. Open Inquiries For Lender
    window.openOwnerItemChats = async function(itemId, itemTitle) {
      const q = query(
        collection(db, "conversations"), 
        where("itemId", "==", itemId),
        where("lenderUid", "==", currentUser.uid)
      );
      const snap = await getDocs(q);

      if (snap.empty) {
        alert("No one has messaged about this item yet!");
        return;
      }

      if (snap.size === 1) {
        const convoDoc = snap.docs[0];
        openChatWindow(convoDoc.id, `${itemTitle} (with ${convoDoc.data().borrowerName})`);
      } else {
        openInbox();
      }
    };

    // 6. Global Inbox (My Chats)
    window.openInbox = function() {
      if (!currentUser) return alert("Sign in first!");
      document.getElementById("chatModal").style.display = "none";
      const modal = document.getElementById("inboxModal");
      modal.style.display = "flex";

      const listEl = document.getElementById("inboxList");
      listEl.innerHTML = "<div style='color:#777; font-size:0.85rem;'>Loading chats...</div>";

      const q = query(
        collection(db, "conversations"), 
        where("participants", "array-contains", currentUser.uid)
      );

      onSnapshot(q, (snap) => {
        listEl.innerHTML = "";
        if (snap.empty) {
          listEl.innerHTML = "<div class='empty-state'>No active chats yet.</div>";
          return;
        }

        snap.forEach((d) => {
          const c = d.data();
          const isLender = c.lenderUid === currentUser.uid;
          const otherPerson = isLender ? c.borrowerName : c.lenderName;

          const card = document.createElement("div");
          card.className = "inbox-card";
          card.onclick = () => {
            modal.style.display = "none";
            openChatWindow(d.id, `${c.itemTitle} (with ${otherPerson})`);
          };
          card.innerHTML = `
            <div class="inbox-item-title">${c.itemTitle}</div>
            <div class="inbox-item-sub">${isLender ? 'Inquiry from' : 'Lender'}: <strong>${otherPerson}</strong></div>
          `;
          listEl.appendChild(card);
        });
      });
    };

    window.closeInbox = () => { document.getElementById("inboxModal").style.display = "none"; };

    // 7. Live Chat Messages
    function openChatWindow(convoId, displayTitle) {
      activeConversationId = convoId;
      document.getElementById("chatItemTitle").innerText = displayTitle;
      document.getElementById("chatModal").style.display = "flex";

      if (unsubscribeMessages) unsubscribeMessages();

      const messagesBox = document.getElementById("chatMessages");
      messagesBox.innerHTML = "<div style='color:#777; font-size:0.85rem;'>Loading conversation...</div>";

      const q = collection(db, "conversations", convoId, "messages");
      unsubscribeMessages = onSnapshot(q, (snap) => {
        messagesBox.innerHTML = "";
        if (snap.empty) {
          messagesBox.innerHTML = "<div style='color:#777; font-size:0.85rem;'>No messages yet. Send a message to start!</div>";
          return;
        }

        const msgs = [];
        snap.forEach(d => msgs.push(d.data()));
        msgs.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

        msgs.forEach(m => {
          const isMine = m.senderUid === currentUser.uid;
          const wrapper = document.createElement("div");
          wrapper.className = `msg-wrapper ${isMine ? 'mine' : 'theirs'}`;
          wrapper.innerHTML = `
            <div class="msg-author">${isMine ? 'You' : m.senderName}</div>
            <div class="msg-bubble">${m.text}</div>
          `;
          messagesBox.appendChild(wrapper);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
      });
    }

    window.closeChat = () => {
      document.getElementById("chatModal").style.display = "none";
      if (unsubscribeMessages) unsubscribeMessages();
      activeConversationId = null;
    };

    window.sendMessage = async function(e) {
      e.preventDefault();
      if (!activeConversationId || !currentUser) return;

      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      await addDoc(collection(db, "conversations", activeConversationId, "messages"), {
        senderUid: currentUser.uid,
        senderName: currentUser.displayName,
        text,
        createdAt: serverTimestamp()
      });
    };
  </script>
</head>
<body>
  <div class="app-wrapper">
    <header>
      <h1>BorrowBox</h1>
      <div class="user-auth-area" id="authArea">
        <button class="btn-auth" onclick="login()">Google Sign In</button>
      </div>
    </header>

    <div class="main-grid">
      <!-- Listing Form -->
      <section class="card sticky-panel">
        <h2>List Gear to Lend</h2>
        
        <label for="itemTitle">Item Name</label>
        <input type="text" id="itemTitle" placeholder="e.g. Drafter, Casio fx-991" />

        <label for="itemLocation">Pickup Point</label>
        <input type="text" id="itemLocation" placeholder="e.g. Library 1st Floor, Hostel Block 2" />

        <label for="itemCategory">Category</label>
        <select id="itemCategory">
          <option>Calculators & Tools</option>
          <option>Lab Equipment / Coats</option>
          <option>Textbooks & Notes</option>
          <option>Electronics & Cables</option>
          <option>Sports & Other</option>
        </select>

        <label for="itemPrice">Rent Price (Leave empty for FREE)</label>
        <input type="number" id="itemPrice" placeholder="0 or amount in ₹" />

        <button class="btn-primary" id="submitBtn" onclick="listItem()">List Gear</button>
      </section>

      <!-- Campus Feed -->
      <section class="card">
        <h2>Available on Campus</h2>
        <div id="itemFeed">
          <div class="empty-state">Loading campus gear...</div>
        </div>
      </section>
    </div>
  </div>

  <!-- INBOX DRAWER (Permanent chats list) -->
  <div class="inbox-modal" id="inboxModal">
    <div class="modal-header">
      <strong>My Conversations</strong>
      <button class="close-btn" onclick="closeInbox()">✕</button>
    </div>
    <div class="inbox-list" id="inboxList"></div>
  </div>

  <!-- CHAT DRAWER -->
  <div class="chat-modal" id="chatModal">
    <div class="modal-header">
      <strong id="chatItemTitle">Chat</strong>
      <button class="close-btn" onclick="closeChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-form" onsubmit="sendMessage(event)">
      <input type="text" id="chatInput" placeholder="Type a message..." required />
      <button class="btn-primary" type="submit">Send</button>
    </form>
  </div>
</body>
</html>
