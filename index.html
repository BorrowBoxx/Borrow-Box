<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorrowBox - Campus Sharing</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-hover: #262626;
      --border: #2e2e2e;
      --primary: #2979ff;
      --primary-hover: #1c54b2;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --free-badge: #00e676;
      --req-badge: #b388ff;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    .app-wrapper {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 80px;
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    header h1 {
      font-size: 1.45rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
    }

    .btn-header-auth {
      background: var(--primary);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-header-auth:hover { background: var(--primary-hover); }

    .user-pill-header {
      background: #252525;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Clean Search & View Toggle */
    .filter-section {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
    }

    .search-input:focus { outline: 2px solid var(--primary); }

    .view-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .view-toggle-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    /* Feed Items */
    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .item-card:last-child { border-bottom: none; }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 120px;
    }

    .pill-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    .price-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .price-free { background: rgba(0, 230, 118, 0.15); color: var(--free-badge); }
    .price-paid { background: rgba(41, 121, 255, 0.15); color: var(--primary); }
    .type-request { background: rgba(179, 136, 255, 0.18); color: var(--req-badge); }
    .status-borrowed { background: rgba(117, 117, 117, 0.3); color: #ccc; }

    .btn-sm {
      background: #2a2a2a;
      border: 1px solid #444;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      width: auto;
      cursor: pointer;
      border-radius: 6px;
      color: var(--text);
    }

    .btn-sm:hover { background: var(--primary); border-color: var(--primary); }
    .btn-danger { color: var(--danger); border-color: rgba(255,82,82,0.4); }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Floating Action Button (+) */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 58px;
      height: 58px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      border: none;
      box-shadow: 0 6px 18px rgba(41, 121, 255, 0.45);
      font-size: 2rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 900;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .fab:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    /* Left Drawer Menu */
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1000;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100vh;
      background: #181818;
      border-right: 1px solid var(--border);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 1001;
      transition: left 0.25s ease;
    }

    .drawer.open { left: 0; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .drawer-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-nav button {
      background: #222;
      border: 1px solid var(--border);
      color: var(--text);
      text-align: left;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 8px;
    }

    .drawer-nav button:hover { border-color: var(--primary); }

    .btn-signout {
      color: var(--danger) !important;
      border-color: rgba(255,82,82,0.3) !important;
    }

    .btn-signout:hover {
      background: rgba(255,82,82,0.1) !important;
      border-color: var(--danger) !important;
    }

    .profile-box {
      background: #222;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-box input {
      padding: 8px 10px;
      font-size: 0.88rem;
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #181818;
      border: 1px solid #383838;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 88vh;
    }

    .modal-header {
      background: var(--surface);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 1.2rem; cursor: pointer; width: auto; padding: 0 4px;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
    }

    /* Modal Form Segmented Tabs */
    .form-tabs {
      display: flex;
      background: #252525;
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .form-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 0;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .form-tab-btn.active {
      background: var(--primary);
      color: white;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      margin-top: 12px;
    }

    label:first-of-type { margin-top: 0; }

    input, .btn-primary {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #252525;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus { outline: 2px solid var(--primary); }

    .btn-primary {
      margin-top: 18px;
      background: var(--primary);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .inbox-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .inbox-card:hover { border-color: var(--primary); background: var(--surface-hover); }
    .inbox-item-title { font-weight: 600; font-size: 0.95rem; color: var(--primary); margin-bottom: 4px; }
    .inbox-item-sub { font-size: 0.8rem; color: var(--text-muted); }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      max-height: 50vh;
    }

    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.mine { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.theirs { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; }
    .mine .msg-bubble { background: var(--primary); color: white; }
    .theirs .msg-bubble { background: #2b2b2b; color: var(--text); }
    .msg-author { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; }

    .chat-form {
      padding: 10px; background: var(--surface);
      border-top: 1px solid var(--border); display: flex; gap: 8px;
    }
    .chat-form input { margin: 0; padding: 9px 12px; font-size: 0.88rem; }
    .chat-form button { margin: 0; width: auto; padding: 9px 16px; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 36px 0; font-size: 0.95rem; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, 
      doc, updateDoc, deleteDoc, where, getDocs, setDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDaRZSOTsZKW2XXWXN7ShSB0FWnz3fOMDo",
      authDomain: "borrowbox-80a89.firebaseapp.com",
      projectId: "borrowbox-80a89",
      storageBucket: "borrowbox-80a89.firebasestorage.app",
      messagingSenderId: "666197824095",
      appId: "1:666197824095:web:097462096aaf8291d941ea"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let activeConversationId = null;
    let unsubscribeMessages = null;

    let allItems = [];
    let currentFilter = "all"; // "all" or "requests"
    let searchQuery = "";
    let activeFormMode = "lend"; // "lend" or "request"

    function getMyDisplayName() {
      const saved = localStorage.getItem("borrowbox_custom_name");
      if (saved && saved.trim()) return saved.trim();
      return currentUser ? (currentUser.displayName || currentUser.email.split("@")[0]) : "Student";
    }

    // 1. Auth Listener
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const headerAuth = document.getElementById("headerAuthSection");
      const drawerAuth = document.getElementById("drawerAuthSection");
      const profileSection = document.getElementById("profileSection");

      if (user) {
        if (!localStorage.getItem("borrowbox_custom_name")) {
          localStorage.setItem("borrowbox_custom_name", user.displayName || user.email.split("@")[0]);
        }

        headerAuth.innerHTML = `
          <div class="user-pill-header" onclick="openDrawer()">
            👤 ${getMyDisplayName().split(" ")[0]}
          </div>
        `;

        profileSection.style.display = "flex";
        document.getElementById("customNameInput").value = getMyDisplayName();

        drawerAuth.innerHTML = `
          <button class="btn-signout" onclick="logout()">🚪 Sign Out</button>
        `;
      } else {
        headerAuth.innerHTML = `
          <button class="btn-header-auth" onclick="login()">Sign In</button>
        `;
        profileSection.style.display = "none";
        drawerAuth.innerHTML = ``;
      }
      renderFeed();
    });

    window.saveCustomName = function() {
      const input = document.getElementById("customNameInput");
      const val = input.value.trim();
      if (!val) return alert("Display name cannot be empty.");
      localStorage.setItem("borrowbox_custom_name", val);
      alert("Display name updated to: " + val);
      if (currentUser) {
        document.getElementById("headerAuthSection").innerHTML = `
          <div class="user-pill-header" onclick="openDrawer()">
            👤 ${val.split(" ")[0]}
          </div>
        `;
      }
      renderFeed();
    };

    window.login = async () => {
      try { 
        await signInWithPopup(auth, provider);
      } catch (err) { alert("Login failed: " + err.message); }
    };

    window.logout = () => {
      signOut(auth);
      closeDrawer();
    };

    // 2. Real-Time Feed Listener
    const qItems = query(collection(db, "items"), orderBy("createdAt", "desc"));
    onSnapshot(qItems, (snapshot) => {
      allItems = [];
      snapshot.forEach(docSnap => {
        allItems.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderFeed();
    });

    function renderFeed() {
      const feedContainer = document.getElementById("itemFeed");
      feedContainer.innerHTML = "";

      const filtered = allItems.filter(item => {
        const matchesFilter = (currentFilter === "all") || (item.type === "request");
        const text = `${item.title || ""} ${item.location || ""} ${item.ownerName || ""}`.toLowerCase();
        const matchesSearch = !searchQuery || text.includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        feedContainer.innerHTML = `<div class="empty-state">Nothing found on campus right now.<br>Tap the + button to share or ask for something!</div>`;
        return;
      }

      filtered.forEach(item => {
        const isOwner = currentUser && item.ownerUid === currentUser.uid;
        const isBorrowed = item.status === "borrowed";
        const isRequest = item.type === "request";

        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <div>
            <div class="item-title">${item.title || "Untitled"}</div>
            <div class="item-sub">
              📍 ${item.location || "Campus"} • ${isRequest ? "Requested by" : "Posted by"}: <strong>${isOwner ? "You (" + item.ownerName + ")" : (item.ownerName || "Student")}</strong>
            </div>
          </div>
          <div class="item-actions">
            <div class="pill-group">
              ${isRequest 
                ? '<span class="price-pill type-request">REQUEST</span>' 
                : `<span class="price-pill ${item.isFree ? 'price-free' : 'price-paid'}">${item.isFree ? "FREE" : "₹" + item.price}</span>`
              }
              ${isBorrowed ? '<span class="price-pill status-borrowed">RESOLVED</span>' : ''}
            </div>

            ${isOwner ? `
              <div style="display:flex; gap:4px; margin-top:4px;">
                <button class="btn-sm" onclick="openOwnerItemChats('${item.id}', '${item.title.replace(/'/g, "\\'")}')">
                  💬 Inquiries
                </button>
                <button class="btn-sm" onclick="toggleBorrowed('${item.id}', ${isBorrowed})">
                  ${isBorrowed ? (isRequest ? "Reopen" : "Available") : (isRequest ? "Mark Fulfilled" : "Borrowed")}
                </button>
                <button class="btn-sm btn-danger" onclick="deleteItem('${item.id}')">✕</button>
              </div>
            ` : `
              <button class="btn-sm" ${isBorrowed ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''} 
                onclick="startChatWithLender('${item.id}', '${item.title.replace(/'/g, "\\'")}', '${item.ownerUid}', '${item.ownerName.replace(/'/g, "\\'")}')">
                ${isBorrowed ? "Closed" : (isRequest ? "I Have This" : "Chat / Borrow")}
              </button>
            `}
          </div>
        `;
        feedContainer.appendChild(div);
      });
    }

    // Search and Filter Handlers
    window.handleSearch = function(e) {
      searchQuery = e.target.value.trim();
      renderFeed();
    };

    window.toggleFilter = function(filter) {
      currentFilter = filter;
      document.getElementById("btnFilterAll").classList.toggle("active", filter === "all");
      document.getElementById("btnFilterReq").classList.toggle("active", filter === "requests");
      renderFeed();
    };

    // 3. Modal Form: Dual-Mode Tabs (Lend vs Request)
    window.setFormMode = function(mode) {
      activeFormMode = mode;
      const tabLend = document.getElementById("tabLend");
      const tabReq = document.getElementById("tabRequest");
      const priceContainer = document.getElementById("priceFieldContainer");
      const submitBtn = document.getElementById("modalSubmitBtn");
      const titleLabel = document.getElementById("titleLabel");

      if (mode === "lend") {
        tabLend.classList.add("active");
        tabReq.classList.remove("active");
        priceContainer.style.display = "block";
        titleLabel.innerText = "What are you lending?";
        document.getElementById("itemTitle").placeholder = "e.g. Casio fx-991, Drafter, Lab Coat";
        submitBtn.innerText = "Post Item";
      } else {
        tabReq.classList.add("active");
        tabLend.classList.remove("active");
        priceContainer.style.display = "none";
        titleLabel.innerText = "What do you need?";
        document.getElementById("itemTitle").placeholder = "e.g. Need Drafter for EG lab at 2 PM";
        submitBtn.innerText = "Ask Campus";
      }
    };

    window.openFormModal = () => {
      if (!currentUser) return alert("Please sign in from the top right before posting!");
      document.getElementById("formModal").style.display = "flex";
      setFormMode("lend");
    };
    window.closeFormModal = () => { document.getElementById("formModal").style.display = "none"; };

    window.postEntry = async function() {
      if (!currentUser) return alert("Sign in first!");
      const title = document.getElementById("itemTitle").value.trim();
      const location = document.getElementById("itemLocation").value.trim();
      const price = document.getElementById("itemPrice").value.trim();

      if (!title) return alert("Please enter what you are lending or requesting.");

      const isRequest = (activeFormMode === "request");
      const isFree = !price || price === "0";

      await addDoc(collection(db, "items"), {
        ownerUid: currentUser.uid,
        ownerName: getMyDisplayName(),
        title,
        location: location || "Campus",
        type: isRequest ? "request" : "lend",
        isFree: isRequest ? true : isFree,
        price: isRequest ? 0 : (isFree ? 0 : Number(price)),
        status: "available",
        createdAt: serverTimestamp()
      });

      document.getElementById("itemTitle").value = "";
      document.getElementById("itemLocation").value = "";
      document.getElementById("itemPrice").value = "";
      closeFormModal();
    };

    window.toggleBorrowed = async (id, currentStatus) => {
      await updateDoc(doc(db, "items", id), {
        status: currentStatus ? "available" : "borrowed"
      });
    };

    window.deleteItem = async (id) => {
      if (confirm("Remove this post permanently?")) {
        await deleteDoc(doc(db, "items", id));
      }
    };

    // 4. Drawer Navigation
    window.openDrawer = () => {
      document.getElementById("drawer").classList.add("open");
      document.getElementById("drawerOverlay").style.display = "block";
    };

    window.closeDrawer = () => {
      document.getElementById("drawer").classList.remove("open");
      document.getElementById("drawerOverlay").style.display = "none";
    };

    // 5. Chats & Inbox
    window.openInbox = function() {
      closeDrawer();
      if (!currentUser) return alert("Please sign in from the top right first!");
      document.getElementById("inboxModal").style.display = "flex";

      const listEl = document.getElementById("inboxList");
      listEl.innerHTML = "<div style='color:#777; font-size:0.85rem;'>Loading chats...</div>";

      const q = query(
        collection(db, "conversations"), 
        where("participants", "array-contains", currentUser.uid)
      );

      onSnapshot(q, (snap) => {
        listEl.innerHTML = "";
        if (snap.empty) {
          listEl.innerHTML = "<div class='empty-state'>No active conversations yet.</div>";
          return;
        }

        snap.forEach((d) => {
          const c = d.data();
          const isLender = c.lenderUid === currentUser.uid;
          const otherPerson = isLender ? c.borrowerName : c.lenderName;

          const card = document.createElement("div");
          card.className = "inbox-card";
          card.onclick = () => {
            closeInbox();
            openChatWindow(d.id, `${c.itemTitle} (with ${otherPerson})`);
          };
          card.innerHTML = `
            <div class="inbox-item-title">${c.itemTitle}</div>
            <div class="inbox-item-sub">${isLender ? 'Inquiry from' : 'Sender'}: <strong>${otherPerson}</strong></div>
          `;
          listEl.appendChild(card);
        });
      });
    };

    window.closeInbox = () => { document.getElementById("inboxModal").style.display = "none"; };

    window.startChatWithLender = async function(itemId, itemTitle, lenderUid, lenderName) {
      if (!currentUser) return alert("Please sign in to message.");
      if (currentUser.uid === lenderUid) return alert("This is your own post!");

      const myName = getMyDisplayName();
      const convoId = `${itemId}_${currentUser.uid}`;
      await setDoc(doc(db, "conversations", convoId), {
        itemId,
        itemTitle,
        borrowerUid: currentUser.uid,
        borrowerName: myName,
        lenderUid,
        lenderName,
        participants: [currentUser.uid, lenderUid],
        lastUpdated: serverTimestamp()
      }, { merge: true });

      openChatWindow(convoId, `${itemTitle} (with ${lenderName})`);
    };

    window.openOwnerItemChats = async function(itemId, itemTitle) {
      const q = query(
        collection(db, "conversations"), 
        where("itemId", "==", itemId),
        where("lenderUid", "==", currentUser.uid)
      );
      const snap = await getDocs(q);

      if (snap.empty) {
        alert("No inquiries on this post yet!");
        return;
      }

      if (snap.size === 1) {
        const convoDoc = snap.docs[0];
        openChatWindow(convoDoc.id, `${itemTitle} (with ${convoDoc.data().borrowerName})`);
      } else {
        openInbox();
      }
    };

    function openChatWindow(convoId, displayTitle) {
      activeConversationId = convoId;
      document.getElementById("chatItemTitle").innerText = displayTitle;
      document.getElementById("chatModal").style.display = "flex";

      if (unsubscribeMessages) unsubscribeMessages();

      const messagesBox = document.getElementById("chatMessages");
      messagesBox.innerHTML = "<div style='color:#777; font-size:0.85rem;'>Loading conversation...</div>";

      const q = collection(db, "conversations", convoId, "messages");
      unsubscribeMessages = onSnapshot(q, (snap) => {
        messagesBox.innerHTML = "";
        if (snap.empty) {
          messagesBox.innerHTML = "<div style='color:#777; font-size:0.85rem;'>No messages yet. Say hello!</div>";
          return;
        }

        const msgs = [];
        snap.forEach(d => msgs.push(d.data()));
        msgs.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

        msgs.forEach(m => {
          const isMine = m.senderUid === currentUser.uid;
          const wrapper = document.createElement("div");
          wrapper.className = `msg-wrapper ${isMine ? 'mine' : 'theirs'}`;
          wrapper.innerHTML = `
            <div class="msg-author">${isMine ? 'You' : m.senderName}</div>
            <div class="msg-bubble">${m.text}</div>
          `;
          messagesBox.appendChild(wrapper);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
      });
    }

    window.closeChat = () => {
      document.getElementById("chatModal").style.display = "none";
      if (unsubscribeMessages) unsubscribeMessages();
      activeConversationId = null;
    };

    window.sendMessage = async function(e) {
      e.preventDefault();
      if (!activeConversationId || !currentUser) return;

      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      await addDoc(collection(db, "conversations", activeConversationId, "messages"), {
        senderUid: currentUser.uid,
        senderName: getMyDisplayName(),
        text,
        createdAt: serverTimestamp()
      });
    };
  </script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header>
      <div class="header-left">
        <button class="menu-btn" onclick="openDrawer()">☰</button>
        <h1>BorrowBox</h1>
      </div>
      <div class="header-right" id="headerAuthSection">
        <button class="btn-header-auth" onclick="login()">Sign In</button>
      </div>
    </header>

    <!-- Search & Feed Filter -->
    <div class="filter-section">
      <input 
        type="text" 
        class="search-input" 
        placeholder="🔍 Search items on campus..." 
        oninput="handleSearch(event)"
      />
      <button class="view-toggle-btn active" id="btnFilterAll" onclick="toggleFilter('all')">All</button>
      <button class="view-toggle-btn" id="btnFilterReq" onclick="toggleFilter('requests')">🙋 Requests</button>
    </div>

    <!-- Feed -->
    <section class="card">
      <h2>Campus Feed</h2>
      <div id="itemFeed">
        <div class="empty-state">Loading campus items...</div>
      </div>
    </section>
  </div>

  <!-- FLOATING ACTION BUTTON (+) -->
  <button class="fab" onclick="openFormModal()">+</button>

  <!-- LEFT DRAWER MENU (☰) -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 style="font-size:1.2rem; color:var(--primary);">BorrowBox</h2>
      <button class="close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-nav">
      <div id="profileSection" class="profile-box" style="display:none;">
        <label for="customNameInput" style="font-size:0.75rem; color:var(--text-muted);">Your Display Name</label>
        <input type="text" id="customNameInput" placeholder="e.g. Sasi, Rahul" />
        <button class="btn-sm" onclick="saveCustomName()">Save Name</button>
      </div>

      <button onclick="openInbox()">💬 My Chats</button>
      <div id="drawerAuthSection" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- POST MODAL (Lend vs Request) -->
  <div class="modal-backdrop" id="formModal">
    <div class="modal-box">
      <div class="modal-header">
        <strong>Create a Post</strong>
        <button class="close-btn" onclick="closeFormModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-tabs">
          <button type="button" class="form-tab-btn active" id="tabLend" onclick="setFormMode('lend')">📦 Share Item</button>
          <button type="button" class="form-tab-btn" id="tabRequest" onclick="setFormMode('request')">🙋 Ask Campus</button>
        </div>

        <label for="itemTitle" id="titleLabel">What are you lending?</label>
        <input type="text" id="itemTitle" placeholder="e.g. Casio fx-991, Drafter, Lab Coat" />

        <label for="itemLocation">Pickup Point / Hostel</label>
        <input type="text" id="itemLocation" placeholder="e.g. Library, Block 2, Canteen" />

        <div id="priceFieldContainer">
          <label for="itemPrice">Rent Price (Leave empty for FREE)</label>
          <input type="number" id="itemPrice" placeholder="0 or amount in ₹" />
        </div>

        <button class="btn-primary" id="modalSubmitBtn" onclick="postEntry()">Post Item</button>
      </div>
    </div>
  </div>

  <!-- INBOX MODAL -->
  <div class="modal-backdrop" id="inboxModal">
    <div class="modal-box">
      <div class="modal-header">
        <strong>My Conversations</strong>
        <button class="close-btn" onclick="closeInbox()">✕</button>
      </div>
      <div class="modal-body" id="inboxList"></div>
    </div>
  </div>

  <!-- CHAT MODAL -->
  <div class="modal-backdrop" id="chatModal">
    <div class="modal-box">
      <div class="modal-header">
        <strong id="chatItemTitle">Chat</strong>
        <button class="close-btn" onclick="closeChat()">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" onsubmit="sendMessage(event)">
        <input type="text" id="chatInput" placeholder="Type a message..." required />
        <button class="btn-primary" type="submit">Send</button>
      </form>
    </div>
  </div>
</body>
</html>
