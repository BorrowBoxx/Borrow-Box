<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorrowBox - Campus Lending</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-bright: #262626;
      --border: #2e2e2e;
      --primary: #2979ff;
      --primary-hover: #1c54b2;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --free-badge: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 20px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .badge-status {
      font-size: 0.75rem;
      color: #00e676;
      background: rgba(0, 230, 118, 0.1);
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .sticky-panel {
      position: sticky;
      top: 24px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }

    label:first-of-type {
      margin-top: 0;
    }

    input, select, button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #252525;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary);
    }

    .btn-primary {
      margin-top: 16px;
      background: var(--primary);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .item-card:last-child {
      border-bottom: none;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .item-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 100px;
    }

    .price-pill {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .price-free {
      background: rgba(0, 230, 118, 0.15);
      color: var(--free-badge);
    }

    .price-paid {
      background: rgba(41, 121, 255, 0.15);
      color: var(--primary);
    }

    .btn-chat {
      background: #333;
      border: 1px solid #444;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      width: auto;
      cursor: pointer;
    }

    .btn-chat:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* In-App Chat Modal / Drawer */
    .chat-modal {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 360px;
      height: 480px;
      background: #181818;
      border: 1px solid #383838;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
    }

    .chat-header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header strong {
      font-size: 0.95rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      width: auto;
      padding: 0 4px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      background: #252525;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .msg-author {
      font-size: 0.72rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .chat-form {
      padding: 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .chat-form input {
      margin: 0;
      padding: 8px 12px;
      font-size: 0.88rem;
    }

    .chat-form button {
      margin: 0;
      width: auto;
      padding: 8px 14px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 36px 0;
      font-size: 0.95rem;
    }
  </style>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDaRZSOTsZKW2XXWXN7ShSB0FWnz3fOMDo",
      authDomain: "borrowbox-80a89.firebaseapp.com",
      projectId: "borrowbox-80a89",
      storageBucket: "borrowbox-80a89.firebasestorage.app",
      messagingSenderId: "666197824095",
      appId: "1:666197824095:web:097462096aaf8291d941ea"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeItemId = null;
    let unsubscribeChat = null;

    // Real-Time Gear Feed
    const feedContainer = document.getElementById("itemFeed");
    const qItems = query(collection(db, "items"), orderBy("createdAt", "desc"));

    onSnapshot(qItems, (snapshot) => {
      feedContainer.innerHTML = "";
      if (snapshot.empty) {
        feedContainer.innerHTML = `<div class="empty-state">No gear listed yet.<br>Add an item on the left to test!</div>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <div>
            <div class="item-title">${item.title || "Untitled Item"}</div>
            <div class="item-sub">📍 ${item.location || "Campus"} • Listed by: <strong>${item.ownerName || "Student"}</strong></div>
          </div>
          <div class="item-actions">
            <span class="price-pill ${item.isFree ? 'price-free' : 'price-paid'}">
              ${item.isFree ? "FREE" : "₹" + item.price}
            </span>
            <button class="btn-chat" onclick="openChat('${id}', '${item.title.replace(/'/g, "\\'")}')">Chat / Ask</button>
          </div>
        `;
        feedContainer.appendChild(div);
      });
    });

    // List New Item
    window.listItem = async function() {
      const ownerInput = document.getElementById("ownerName");
      const titleInput = document.getElementById("itemTitle");
      const locationInput = document.getElementById("itemLocation");
      const categoryInput = document.getElementById("itemCategory");
      const priceInput = document.getElementById("itemPrice");
      const submitBtn = document.getElementById("submitBtn");

      const ownerName = ownerInput.value.trim();
      const title = titleInput.value.trim();
      const location = locationInput.value.trim();
      const category = categoryInput.value;
      const price = priceInput.value.trim();

      if (!ownerName || !title) {
        alert("Please enter your name and the item title.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Listing...";

      try {
        const isFree = !price || price === "0";
        await addDoc(collection(db, "items"), {
          ownerName,
          title,
          location: location || "Campus",
          category,
          isFree,
          price: isFree ? 0 : Number(price),
          createdAt: serverTimestamp()
        });

        titleInput.value = "";
        locationInput.value = "";
        priceInput.value = "";
      } catch (err) {
        alert("Failed to add item: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "List Gear";
      }
    };

    // Open Chat Drawer for a Specific Item
    window.openChat = function(itemId, itemTitle) {
      activeItemId = itemId;
      document.getElementById("chatItemTitle").innerText = itemTitle;
      const modal = document.getElementById("chatModal");
      modal.style.display = "flex";

      if (unsubscribeChat) unsubscribeChat();

      const messagesBox = document.getElementById("chatMessages");
      messagesBox.innerHTML = "<div style='color:#777; font-size:0.85rem;'>Loading conversation...</div>";

      // Listen for messages inside this specific item
      const qChat = query(collection(db, "items", itemId, "messages"), orderBy("createdAt", "asc"));
      unsubscribeChat = onSnapshot(qChat, (snap) => {
        messagesBox.innerHTML = "";
        if (snap.empty) {
          messagesBox.innerHTML = "<div style='color:#777; font-size:0.85rem;'>No messages yet. Ask if it's available!</div>";
          return;
        }

        snap.forEach((msgDoc) => {
          const m = msgDoc.data();
          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";
          bubble.innerHTML = `
            <div class="msg-author">${m.senderName || "Student"}</div>
            <div>${m.text}</div>
          `;
          messagesBox.appendChild(bubble);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
      });
    };

    window.closeChat = function() {
      document.getElementById("chatModal").style.display = "none";
      if (unsubscribeChat) unsubscribeChat();
      activeItemId = null;
    };

    // Send Message
    window.sendMessage = async function(e) {
      e.preventDefault();
      if (!activeItemId) return;

      const senderInput = document.getElementById("chatSender");
      const textInput = document.getElementById("chatInput");
      const senderName = senderInput.value.trim() || "Borrower";
      const text = textInput.value.trim();

      if (!text) return;

      textInput.value = "";
      await addDoc(collection(db, "items", activeItemId, "messages"), {
        senderName,
        text,
        createdAt: serverTimestamp()
      });
    };
  </script>
</head>
<body>
  <div class="app-wrapper">
    <header>
      <h1>BorrowBox</h1>
      <span class="badge-status">● Live Campus Network</span>
    </header>

    <div class="main-grid">
      <!-- LEFT SIDE: Listing Form -->
      <section class="card sticky-panel">
        <h2>List Gear to Lend</h2>

        <label for="ownerName">Your Name</label>
        <input type="text" id="ownerName" placeholder="e.g. Rahul" />
        
        <label for="itemTitle">Item Name</label>
        <input type="text" id="itemTitle" placeholder="e.g. Lab Apron" />

        <label for="itemLocation">Campus Pickup Point</label>
        <input type="text" id="itemLocation" placeholder="e.g. Central Library, Block 2 Canteen" />

        <label for="itemCategory">Category</label>
        <select id="itemCategory">
          <option>Calculators & Tools</option>
          <option>Lab Equipment / Coats</option>
          <option>Textbooks & Notes</option>
          <option>Electronics & Cables</option>
          <option>Sports & Other</option>
        </select>

        <label for="itemPrice">Rent Price (Leave empty for FREE)</label>
        <input type="number" id="itemPrice" placeholder="0 or amount in ₹" />

        <button class="btn-primary" id="submitBtn" onclick="listItem()">List Gear</button>
      </section>

      <!-- RIGHT SIDE: Feed -->
      <section class="card">
        <h2>Available on Campus</h2>
        <div id="itemFeed">
          <div class="empty-state">Connecting to campus database...</div>
        </div>
      </section>
    </div>
  </div>

  <!-- IN-APP CHAT DRAWER -->
  <div class="chat-modal" id="chatModal">
    <div class="chat-header">
      <strong id="chatItemTitle">Item Chat</strong>
      <button class="close-btn" onclick="closeChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-form" onsubmit="sendMessage(event)">
      <input type="text" id="chatSender" placeholder="You" style="width: 70px;" />
      <input type="text" id="chatInput" placeholder="Message..." required />
      <button class="btn-primary" type="submit">Send</button>
    </form>
  </div>
</body>
</html>
